<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honda CG 160 | Veneza</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    :root {
      --azul-escuro: #020617;
      --azul: #1d4ed8;
      --preto: #000000;
      --branco: #ffffff;
    }
    body {
      background: linear-gradient(to bottom, #020617 0%, #0b1120 40%, #000000 100%);
      color: var(--branco);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 60px;
    }
    .navbar {
      background-color: #020617 !important;
      border-bottom: 2px solid var(--azul);
      padding: 8px 12px;
    }
    .navbar a {
      color: var(--branco) !important;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .navbar a:hover {
      color: var(--azul) !important;
    }
    .detail-carousel img {
      height: 420px;
      object-fit: cover;
      border-radius: 8px;
    }
    .detail-card {
      background: rgba(255,255,255,0.96);
      color: var(--preto);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .site-footer {
      text-align: center;
      color: var(--branco);
      background-color: rgba(0, 0, 0, 0.9);
      padding: 15px;
      border-top: 2px solid var(--azul);
      position: fixed;
      bottom: 0;
      width: 100%;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      .detail-carousel img { height: 220px; }
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg px-4">
  <a href="index.html#inicio" class="navbar-brand fw-bold text-light">Veneza Motos</a>
  <div class="ms-auto d-flex gap-3">
    <a href="index.html#estoque">Estoque</a>
    <a href="index.html#catalogo">Catálogo</a>
    <a href="index.html#clientes">Clientes</a>
    <a href="index.html#contato">Contato</a>
  </div>
</nav>

<div class="container-fluid mt-4 mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="row g-4">
        <div class="col-md-6">
          <div id="carouselCarro" class="carousel slide detail-carousel" data-bs-ride="carousel">
            <div class="carousel-inner rounded shadow">
              <div class="carousel-item active">
                <img src="https://via.placeholder.com/800x420/020617/ffffff?text=Honda+CG+160+Frente" class="d-block w-100" alt="Honda CG 160 frontal">
              </div>
              <div class="carousel-item">
                <img src="https://via.placeholder.com/800x420/1f2937/ffffff?text=Honda+CG+160+Lateral" class="d-block w-100" alt="Honda CG 160 lateral">
              </div>
              <div class="carousel-item">
                <img src="https://via.placeholder.com/800x420/1d4ed8/ffffff?text=Honda+CG+160+Traseira" class="d-block w-100" alt="Honda CG 160 traseira">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselCarro" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselCarro" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
        </div>

        <div class="col-md-6">
          <div class="detail-card">
            <h2 class="fw-bold">Honda CG 160</h2>
            <p class="text-dark fs-4 fw-semibold">A partir de R$ 399/mês</p>
            <table class="table table-striped align-middle">
              <tbody>
                <tr>
                  <th scope="row"><i data-feather="calendar" class="text-dark"></i> Ano/Modelo</th>
                  <td>2021 / 2021</td>
                </tr>
                <tr>
                  <th scope="row"><i data-feather="zap" class="text-dark"></i> Cilindrada</th>
                  <td>162 cc</td>
                </tr>
                <tr>
                  <th scope="row"><i data-feather="droplet" class="text-dark"></i> Combustível</th>
                  <td>Flex</td>
                </tr>
                <tr>
                  <th scope="row"><i data-feather="settings" class="text-dark"></i> Câmbio</th>
                  <td>Manual</td>
                </tr>
              </tbody>
            </table>
            <h5 class="mt-4">Principais itens</h5>
            <ul class="list-unstyled">
              <li><i data-feather="wind" class="text-dark"></i> Partida elétrica</li>
              <li><i data-feather="disc" class="text-dark"></i> Freio dianteiro a disco</li>
              <li><i data-feather="shield" class="text-dark"></i> Sistema CBS</li>
            </ul>
            <a href="index.html#contato" class="btn btn-success btn-lg mt-3">
              <i data-feather="phone" class="text-light"></i> Falar com vendedores
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p class="mb-0">© 2025 Veneza Motos e Veículos</p>
</footer>

<script>
  feather.replace();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
