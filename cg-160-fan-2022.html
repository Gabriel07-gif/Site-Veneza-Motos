<script>
(function() {
  const STORAGE_KEY = "veneza_vehicle_theme";
  const body = document.body;
  const applyTheme = (theme) => {
    if (!body) return;
    body.setAttribute("data-theme", theme);
    try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
    const toggle = document.querySelector('[data-role="vehicle-theme-toggle"]');
    if (toggle) toggle.textContent = theme === "dark" ? "Modo claro" : "Modo escuro";
  };

  const saved = (() => {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  })();
  applyTheme(saved === "light" ? "light" : "dark");

  const navInner = document.querySelector('.navbar-inner');
  if (navInner && !navInner.querySelector('[data-role="vehicle-theme-toggle"]')) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-toggle-vehicle';
    btn.setAttribute('data-role', 'vehicle-theme-toggle');
    btn.textContent = body.getAttribute('data-theme') === 'dark' ? 'Modo claro' : 'Modo escuro';
    btn.addEventListener('click', () => {
      const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    });
    navInner.appendChild(btn);
  }
})();
</script>
